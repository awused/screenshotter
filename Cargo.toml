[package]
name = "screenshotter"
version = "0.1.0"
edition = "2024"
description = "Awused's screenshot tool for wayland"
readme = "README.md"
license = "MIT"
keywords = ["screenshot", "wayland"]
homepage = "https://github.com/awused/screenshotter"
repository = "https://github.com/awused/screenshotter"

[dependencies]
awconf = { git = "https://github.com/awused/awconf" }
clap = { version = "4.6.7", features = ["derive", "color"] }
color-eyre = "0.6.5"
constcat = "0.6.1"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = [ "pnm", "png",  "webp" ] }
input-event-codes = "6.2.0"
libc = "0.2.191"
nix = {version = "0.31.3", default-features = false }
notify-rust = "4.18.2"
path-clean = "1.0.1"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", default-features = false, features = [ "derive" ] }
shlex = "2.0.1"
strfmt = "0.2.6"
swayipc = { version = "4.0.0", optional = true }
# hyprland = { version = "=0.4.0-beta.3", optional = true }
hyprland = { git = "https://github.com/hyprland-community/hyprland-rs", branch = "master", optional = true }
# hyprland = { git = "https://github.com/awused/hyprland-rs", branch = "56", optional = true }
# hyprland = { path = "../../third_party/hyprland-rs", optional = true }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = [ "macros", "net", "process", "rt", "sync", "time" ] }
toml = "1.1.8"
time = {version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
# Use git because of big breaking changes coming
wayland-protocols-wlr = { git = "https://github.com/Smithay/wayland-rs" , features = ["client"] }
wayland-client = {git = "https://github.com/Smithay/wayland-rs"}
wayland-protocols = { git = "https://github.com/Smithay/wayland-rs", features = ["client", "staging", "unstable"] }
xkbcommon = { version = "0.9.0", features = ["wayland"]}


# Tracing
nu-ansi-term = "0.50.3"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["hyprland", "sway"]
hyprland = ["dep:hyprland"]
sway = ["dep:swayipc"]
